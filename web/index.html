<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d1a2b">
<title>에이전트빌리지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
  :root{
    --ink:#3b2a1f; --paper:#fff8ea; --paper2:#fdebc8; --line:#7a5233;
    --work:#5fae4e; --idle:#a08a70; --alert:#e8574a; --sky:#2b2140;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1d1a2b;color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #overlay{position:absolute;inset:0;pointer-events:none}
  .tag{position:absolute;transform:translate(-50%,0);white-space:nowrap;pointer-events:auto;cursor:pointer}
  .bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);border:2px solid var(--line);
       border-radius:10px;padding:4px 8px;font-size:12px;line-height:1.35;max-width:190px;min-width:40px;
       box-shadow:0 2px 0 var(--line);pointer-events:auto;cursor:pointer;transition:opacity .4s}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
       border:6px solid transparent;border-top-color:var(--line)}
  .bubble.doing{background:#eaf6e2;border-color:#4f8a3f;box-shadow:0 2px 0 #4f8a3f}
  .bubble.doing:after{border-top-color:#4f8a3f}
  .bubble.alert{background:#ffe6e1;border-color:var(--alert);box-shadow:0 2px 0 var(--alert)}
  .bubble.alert:after{border-top-color:var(--alert)}
  .bubble.faint{opacity:.0;pointer-events:none}
  .bubble .k{font-size:10px;opacity:.65;display:block}
  #hudBtn{position:fixed;left:12px;top:12px;z-index:60;height:40px;min-width:40px;border:2px solid var(--line);border-radius:12px;background:var(--paper);
       box-shadow:0 3px 0 var(--line);font-size:20px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:0 8px}
  #hudBtn span:empty{display:none}
  #hudBtn span{font-size:12px;color:#fff;border-radius:9px;padding:0 6px;line-height:18px;font-family:inherit}
  #hudWork{background:var(--work)} #hudWait{background:var(--alert)} #hudMail{background:#777}
  #hud{display:none;z-index:59}
  #hud.open{display:block}
  #dock{position:fixed;left:12px;bottom:12px;z-index:40;display:flex;gap:6px;align-items:flex-end}
  .dk{position:relative;width:52px;height:66px;background:rgba(255,248,234,.9);border:2px solid var(--line);border-radius:10px;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px;cursor:grab;box-shadow:0 2px 0 var(--line);user-select:none}
  .dk canvas{image-rendering:pixelated;pointer-events:none}
  .dk span{font-size:9px;white-space:nowrap;overflow:hidden;max-width:48px;pointer-events:none}
  .dk i{position:absolute;right:3px;top:3px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff}
  .dk.more{justify-content:center;font-size:15px;cursor:pointer;background:#e6f2da}
  #ghost{display:none;position:fixed;z-index:9998;pointer-events:none;transform:translate(-50%,-90%);opacity:.85}
  #ghost canvas{image-rendering:pixelated}
  body.dragging, body.dragging *{cursor:grabbing !important}
  .tag{cursor:grab;display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:bold;letter-spacing:-.2px;max-width:none;
       padding:3px 11px 3px 8px;border-radius:12px;color:#fff8e6;text-shadow:0 1px 0 #1c0f06;
       background:linear-gradient(180deg,#6d4a30 0%,#4a2f1c 55%,#3b2414 100%);
       border:2px solid #c9a56a;box-shadow:0 2px 0 #24140a,0 0 0 1px #24140a,inset 0 1px 0 rgba(255,255,255,.25);
       transition:transform .12s,opacity .15s,filter .15s}
  .tag span{overflow:hidden;text-overflow:ellipsis;max-width:170px}
  .tag b{background:#ffd35a;color:#4a2f1c;border-radius:8px;padding:0 6px;font-size:11.5px;text-shadow:none}
  .tag .sd{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid #24140a;background:#a99a86}
  .tag .sd.work{background:#6fd35a;box-shadow:0 0 6px #6fd35a}
  .tag .sd.wait{background:#ff5a4a;box-shadow:0 0 6px #ff5a4a}
  .tag.lead{border-color:#ffd35a;background:linear-gradient(180deg,#8a5a2c 0%,#5e3a1c 55%,#46280f 100%);box-shadow:0 2px 0 #24140a,0 0 0 1px #24140a,0 0 10px rgba(255,211,90,.45),inset 0 1px 0 rgba(255,255,255,.3)}
  .tag.hov{transform:translate(-50%,0);background:linear-gradient(180deg,#fff1c2,#ffd35a);color:#3b2414;text-shadow:none;border-color:#fff;
       box-shadow:0 3px 0 #8a5a2c,0 0 0 2px #3b2414,0 0 16px rgba(255,230,140,.9)}
  .tag.dim{opacity:.45;filter:saturate(.6)}
  .bubble.big{max-width:360px;min-width:200px;font-size:15px;line-height:1.5;padding:9px 13px;border-width:3px;
       box-shadow:0 4px 0 var(--line),0 0 22px rgba(255,230,140,.85);text-align:left}
  .bubble.big .bk{font-size:12px;opacity:.65;margin-top:4px}
  .bubble.big .bk:first-child{margin-top:0}
  .bubble.big .bt{font-size:15px}
  .bubble.hov{transform:translate(-50%,-100%) scale(1.06);box-shadow:0 3px 0 var(--line),0 0 18px rgba(255,230,140,.8)}
  #hud{position:fixed;left:12px;top:60px;background:rgba(255,248,234,.94);border:2px solid var(--line);border-radius:10px;
       padding:8px 12px;font-size:13px;box-shadow:0 3px 0 var(--line)}
  #hud b{font-size:16px}
  #hud .row{display:flex;gap:10px;margin-top:4px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  #panel{position:fixed;z-index:70;top:0;right:0;height:100%;width:min(1400px,78vw);background:var(--paper);border-left:3px solid var(--line);
       transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
  #panel.open{transform:none}
  #panel header{padding:14px 16px;background:var(--paper2);border-bottom:2px solid var(--line)}
  #panel h2{margin:0;font-size:18px}
  #panel .meta{font-size:12px;opacity:.75;margin-top:4px}
  #panel .pill{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;margin-right:6px}
  #panel .close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink)}
  #panel .info{padding:10px 16px;font-size:13px;border-bottom:1px dashed var(--line)}
  #panel .info div{margin:3px 0}
  #log{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:88%;padding:7px 10px;border-radius:10px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .msg.agent{background:#fff;border:1.5px solid var(--line);align-self:flex-start}
  .msg.boss{background:#ffe7a8;border:1.5px solid #c49a3a;align-self:flex-end}
  #order{border-top:2px solid var(--line);padding:10px;background:var(--paper2)}
  #order textarea{width:100%;height:64px;border:2px solid var(--line);border-radius:8px;padding:6px;font:inherit;resize:none;background:#fff}
  #order button{margin-top:6px;width:100%;padding:8px;border:2px solid var(--line);border-radius:8px;background:#ffcf5a;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line)}
  #order button:disabled{background:#d9c7a7;color:#7a6a55;cursor:default}
  .msg.boss.sending{opacity:.6}
  .msg.boss .st{display:block;font-size:11px;opacity:.7;margin-top:3px}
  #mail{margin-top:4px;font-size:12px}
  #outBtn{margin-top:6px;width:100%;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:#e6f2da;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 var(--line)}
  #hud .hint{font-size:11px;opacity:.6;margin-top:4px}
  #menu{display:none;position:fixed;z-index:9999;background:var(--paper);border:2px solid var(--line);border-radius:10px;box-shadow:0 3px 0 var(--line);padding:4px;min-width:190px}
  #menu .mhd{font-size:12px;opacity:.65;padding:4px 8px 6px;border-bottom:1px dashed var(--line);margin-bottom:3px}
  #menu button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:14px;padding:7px 9px;border-radius:6px;cursor:pointer;color:var(--ink)}
  #menu button:hover{background:#ffe7a8}
  #outside{position:fixed;top:0;left:0;height:100%;width:min(340px,100vw);background:#f2f7ea;border-right:3px solid var(--line);
       transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column;z-index:50}
  #outside.open{transform:none}
  #outside header{padding:14px 16px;background:#dcebc9;border-bottom:2px solid var(--line);position:relative}
  #outside h2{margin:0;font-size:18px}
  #outside .meta{font-size:12px;opacity:.7;margin-top:3px}
  #outside .close{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink)}
  #outList{flex:1;overflow:auto;padding:8px}
  .orow{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;margin-bottom:7px;cursor:pointer}
  .orow:hover{background:#fffbe9}
  .orow .ot{font-size:14px}
  .orow .os{font-size:12px;opacity:.7;margin:2px 0 4px}
  .orow .oa{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.85}
  .orow .oa button{border:1.5px solid var(--line);background:#ffcf5a;border-radius:6px;font:inherit;font-size:12px;padding:2px 8px;cursor:pointer}
  .team{margin-top:6px;padding:6px 8px;background:#fff6dc;border:1.5px dashed var(--line);border-radius:8px}
  .team div{margin:3px 0}
  .team small{opacity:.6}
  .chip{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:0 7px;margin:1px 2px;font-size:12px;cursor:pointer}
  .chip b{margin-left:4px;color:var(--alert);cursor:pointer}
  .mini{border:1.5px solid var(--line);background:#ffcf5a;border-radius:6px;font:inherit;font-size:12px;padding:1px 7px;cursor:pointer;margin-left:6px}
  #teamWrap{display:none;font-size:13px;margin-top:6px}
  #pickBar{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;background:#fff6c8;border:2px solid #c49a3a;
       border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 3px 0 #c49a3a;max-width:calc(100vw - 120px)}
  #pickBar button{margin-left:8px;border:2px solid var(--line);background:#ffcf5a;border-radius:8px;font:inherit;padding:2px 10px;cursor:pointer}
  #toast{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:80;background:#3b2a1f;color:#fff8ea;padding:8px 14px;border-radius:10px;font-size:14px}
  #menu .sep{border-top:1px dashed var(--line);margin:3px 0}
  #menu small{opacity:.6;font-size:11px}
  #menu button.danger{color:#c23a2e}
  #confirm{display:none;position:fixed;inset:0;z-index:9000;background:rgba(20,14,30,.45);align-items:center;justify-content:center}
  .cbox{background:var(--paper);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:16px 20px;width:min(380px,90vw);font-size:14px}
  .cbox h3{margin:0 0 8px}
  .cbox p{margin:6px 0;line-height:1.5}
  .cbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .cbtn button{border:2px solid var(--line);border-radius:8px;font:inherit;padding:6px 14px;cursor:pointer;background:#eee3cf}
  .cbtn button[data-c=yes]{background:#ffcf5a}
  .cbtn button.danger{background:#e8574a;color:#fff}
  .cnote{font-size:12px;opacity:.75;margin-top:8px;min-height:16px}
  #pickList{display:none;position:fixed;inset:0;z-index:8000;background:rgba(20,14,30,.45);align-items:center;justify-content:center}
  .pbox{background:var(--paper);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);padding:14px 16px;width:min(440px,92vw);max-height:84vh;display:flex;flex-direction:column}
  .pbox h3{margin:0 0 8px;font-size:16px}
  #pkQ{border:2px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;margin-bottom:8px}
  #pkRows{overflow:auto;flex:1;min-height:120px}
  .pk{display:flex;gap:8px;align-items:flex-start;padding:6px 6px;border-bottom:1px dashed #d8c7a8;cursor:pointer;font-size:14px}
  .pk input{margin-top:3px;width:16px;height:16px}
  .pk small{opacity:.6;font-size:11px}
  .pk.off{opacity:.45;cursor:default}
  .pkall{display:flex;gap:6px;margin-bottom:6px}
  .pkall button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:7px;font:inherit;font-size:12px;padding:4px;cursor:pointer}
  .bubble.party{min-width:150px;max-width:230px;text-align:left}
  .bubble .pl{font-size:11.5px;line-height:1.35;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bubble .pl i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--idle);margin-right:4px;vertical-align:middle}
  .bubble .pl.doing i{background:var(--work)} .bubble .pl.alert i{background:var(--alert)}
  .bubble .pl.alert{color:#b8352a}
  .bubble .pl.me{border-bottom:1px dashed var(--line);padding-bottom:3px;margin-bottom:2px;white-space:normal}
  .bubble .pl.more{opacity:.6}
  #hudPost{background:#d9443a}
  #hudCs{background:#2f7dd1}
  body.film #usage,body.film #csBtn,body.film #hudCs,body.film #phoneBtn,body.film [data-act="openSettings"]{display:none!important}
  body.film #hudBtn::after{content:"🎬";position:absolute;right:-8px;top:-8px;font-size:14px}
  .bubble.talk{background:#fffbe8;border-color:#e0a23a;font-size:13px;max-width:240px}
  .bubble.mini{padding:1px 5px;font-size:15px;min-width:0}
  .flist{max-height:44vh;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;margin-top:6px;background:#fff}
  .frow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed #e6d7b8;font-size:13px}
  .frow select{font:inherit;font-size:12px;border:1.5px solid var(--line);border-radius:6px}
  .frow small{opacity:.6}
  #csBtn{margin-top:6px;width:100%;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:#dcecff;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 var(--line)}
  #csN{color:#c23a2e}
  #csbox{display:none;position:fixed;inset:0;z-index:8500;background:rgba(20,14,30,.45);align-items:center;justify-content:center}
  #csbox .mbbox{width:min(760px,96vw);height:min(860px,92vh)}
  #csbox header{background:#dcecff}
  .inq{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:10px}
  .inq.late{border-color:var(--alert);box-shadow:0 0 0 2px #f6c3bd}
  .inq.done{opacity:.6}
  .inq .ih{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
  .inq .ih .ch{border-radius:6px;padding:0 6px;color:#fff;font-weight:bold}
  .inq .ih .age{margin-left:auto;opacity:.7}
  .inq .ih .age.red{color:var(--alert);opacity:1;font-weight:bold}
  .inq .ip{font-weight:bold;font-size:13.5px;margin:4px 0 2px}
  .inq .iq{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:#f7f1e4;border-radius:8px;padding:6px 8px;max-height:220px;overflow:auto;-webkit-user-select:text;user-select:text}
  .inq .ib{font-size:11.5px;opacity:.75;margin:5px 0 2px}
  .inq textarea{width:100%;box-sizing:border-box;min-height:90px;font:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px}
  .inq .ia{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
  .inq .ia button{border:1.5px solid var(--line);border-radius:7px;font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer;background:#fff6dc}
  .inq .ia button.go{background:#ffcf5a;font-weight:bold}
  .inq .ia .msg{font-size:12px}
  .inq .lnk{font-size:12px;color:#2f62b8}
  .inq .lneed.red{background:#ffd9d4;border-color:var(--alert);color:#9a1f14}
  .inq .lneed{margin:6px 0 2px;padding:6px 9px;border-radius:8px;background:#fff1b8;border:2px solid #e0a23a;font-weight:bold;font-size:13px;color:#7a4a00}
  #mbBtn{margin-top:6px;width:100%;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:#ffe1dc;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 var(--line)}
  #mbN{color:#c23a2e}
  #mailbox{display:none;position:fixed;inset:0;z-index:8500;background:rgba(20,14,30,.45);align-items:center;justify-content:center}
  .mbbox{background:var(--paper);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);width:min(620px,94vw);height:min(760px,90vh);display:flex;flex-direction:column;overflow:hidden}
  .mbbox header{position:relative;padding:12px 16px;background:#ffe1dc;border-bottom:2px solid var(--line)}
  .mbbox h3{margin:0;font-size:17px}
  .mbbox .close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink)}
  .mbsub{font-size:12px;opacity:.75;margin-top:3px}
  .mbtabs{display:flex;gap:4px;padding:8px 10px 0;border-bottom:2px solid var(--line)}
  .mbtabs button{border:2px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#efe3cc;font:inherit;font-size:13px;padding:5px 10px;cursor:pointer}
  .mbtabs button.on{background:var(--paper);font-weight:bold}
  .mbtabs b{background:#e8574a;color:#fff;border-radius:8px;padding:0 5px;font-size:11px}
  .mblist{flex:1;overflow:auto;padding:10px}
  .letter{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
  .letter .lh{display:flex;justify-content:space-between;gap:8px;font-size:14px}
  .letter .lh span{font-size:11px;opacity:.6;white-space:nowrap}
  .letter .lw{font-size:11.5px;opacity:.75;margin:2px 0 5px}
  .letter .lb{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
  .letter .la{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .letter .la button,.letter .la select{border:1.5px solid var(--line);background:#fff6dc;border-radius:7px;font:inherit;font-size:12px;padding:3px 8px;cursor:pointer;max-width:220px}
  .mbcompose{border-top:2px solid var(--line);padding:10px;background:var(--paper2)}
  .mbto{font-size:13px;margin-bottom:4px}
  #mbSubj{width:100%;border:2px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;margin-bottom:5px}
  #mbBody{width:100%;height:70px;border:2px solid var(--line);border-radius:8px;padding:6px;font:inherit;resize:none}
  #mbSend{border:2px solid var(--line);background:#ffcf5a;border-radius:8px;font:inherit;padding:6px 16px;cursor:pointer}
  #menu button.hi{background:#e6f2da;font-weight:bold}
  .visit{margin:4px 0;padding:6px 8px;background:#e6f2da;border:1.5px solid #4f8a3f;border-radius:8px}
  .orow .ob{font-size:12px;margin:0 0 4px}
  .bosslink{display:inline-block;background:#fff6dc;border:1.5px solid var(--line);border-radius:8px;padding:0 7px;cursor:pointer}
  .bosslink:hover{background:#ffe7a8}
  #spTitle{width:100%;border:2px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;margin:6px 0}
  #spText{width:100%;height:110px;border:2px solid var(--line);border-radius:8px;padding:6px;font:inherit;resize:vertical}
  #oText{min-height:110px;max-height:45vh;resize:vertical}
  #order.drop{outline:3px dashed #c49a3a;outline-offset:-4px}
  #oAttach{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

<body>
<div id="stage"><div id="wrap"><canvas id="cv"></canvas><div id="overlay"></div></div></div>

<aside id="panel">
  <div id="pGrip" title="눌러서 닫기 · 좌우로 끌어서 넓이 조절"><span>◀ 마을</span></div>
  <div class="pside">
    <header><div class="phead"><div id="pAva"></div><div><h2 id="pTitle"></h2><div class="meta" id="pMeta"></div></div></div></header>
    <div class="info" id="pInfo"></div>
    <div class="pfiles" id="pFiles">
      <div class="th">📎 붙일 파일 <span id="attN"></span></div>
      <div id="oAttach"></div>
      <div class="fdrop">여기로 끌어다 놓거나<br>입력칸에 그림을 붙여넣으세요</div>
      <label class="clip">📎 파일 고르기<input type="file" id="oFile" multiple hidden></label>
    </div>
  </div>
  <div class="pmain">
    <button class="close" data-act="closePanel" title="닫기 (Esc)">×</button>
    <div id="log"></div>
    <div id="order">
      <textarea id="oText" rows="2" placeholder="이 주민에게 시킬 일을 쓰세요 (엔터로 보내기 · 쉬프트+엔터 줄바꿈) · 그림은 붙여넣거나 끌어다 놓기"></textarea>
      <div class="obar">
        <span id="attHint"></span>
        <label id="teamWrap"><input type="checkbox" id="oTeam" checked> 부하 <span id="teamN"></span>명에게 나눠 맡겨도 됨</label>
        <small id="oNote"></small>
        <span class="sp"></span>
        <button id="oNow" title="이 주민이 하던 일을 멈추고 바로 이 말을 읽게 합니다">⚡ 지금 보내기 <small>(하던 일 끊고)</small></button>
        <button id="oSend">보내기 ⏎</button>
      </div>
    </div>
  </div>
</aside>
<aside id="outside">
  <header><button class="close" data-act="toggleOutside">×</button><h2>🌲 마을 밖</h2>
    <div class="meta">들이고 싶은 세션을 누르거나 우클릭하세요</div></header>
  <div id="outList"></div>
</aside>
<aside id="org">
  <header><button class="close" data-act="toggleOrg">×</button><h2>📋 세션 목록</h2>
    <div class="meta">카드를 누르면 부하가 펼쳐집니다 · 💬 대화 · ⚙ 설정 · 우클릭도 됩니다</div>
    <input id="orgQ" placeholder="이름으로 찾기">
    <div class="orgf"><button data-f="all" class="on">전체</button><button data-f="in">🏡 마을 안</button><button data-f="out">🌲 마을 밖</button><button id="orgAll">모두 펼치기/접기</button><button id="orgHide" title="세션을 마을과 목록에서 숨기거나 다시 보이게">🙈 숨김</button></div></header>
  <div id="orgList"></div>
</aside>
<div id="menu"></div>
<div id="pickBar"></div>
<div id="toast"></div>
<div id="confirm"></div>
<div id="pickList"></div>
<div id="mailbox"></div>
<div id="csbox"></div>
<div id="ilchon"></div>
<nav id="mbar"><button data-act="toggleHud">🏡<small>마을</small></button><button data-act="toggleOrg">📋<small>세션</small></button><button data-act="ilchonHome">🏠<small>홈피</small><b id="mbarIc"></b></button><button data-act="ilchonBoard">📰<small>게시판</small></button></nav>
<script src="village.js"></script>
</body>
</html>
